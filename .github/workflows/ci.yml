name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Ubuntu ${{ matrix.ubuntu }}
    runs-on: ubuntu-latest
    container: ubuntu:${{ matrix.ubuntu }}
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['24.04', '26.04']
    steps:
      - uses: actions/checkout@v4

      - name: Build, test and package
        run: packaging/ci-build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: gitq-ubuntu${{ matrix.ubuntu }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
